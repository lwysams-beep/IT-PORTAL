<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香海正覺蓮社佛教正覺蓮社學校 - 智能圖床行政平台 V1.33</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <style>
        body { display: flex; flex-direction: column; height: 100vh; margin: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', 'Segoe UI', Tahoma, sans-serif; background-color: #ffffff; color: #333; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f2f6; }
        ::-webkit-scrollbar-thumb { background: #3498db; border-radius: 5px; border: 2px solid #fff; }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/8n5h1C9K/BCK-School.png');
            background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        #login-screen::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); z-index: 1; }
        .login-box { position: relative; z-index: 2; background: white; padding: 50px 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        .login-box img { width: 100px; margin-bottom: 20px; }
        .login-box h2 { color: #546e7a; margin-top: 0; font-size: 24px; }
        .google-btn { background-color: #fff; border: 2px solid #e0e0e0; border-radius: 30px; padding: 12px 25px; font-size: 16px; font-weight: bold; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 15px; margin: 30px auto 0; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .google-btn:hover { background-color: #f8f9fa; box-shadow: 0 6px 10px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .google-btn img { width: 24px; height: 24px; margin: 0; }

        .main-content { flex-grow: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; } 
        
        .banner-header { position: relative; background-image: url('https://i.ibb.co/8n5h1C9K/BCK-School.png'); background-size: cover; background-position: center; padding: 30px 50px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 6px solid #e74c3c; }
        .banner-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 1)); z-index: 1; }
        
        .header-content, .user-info { position: relative; z-index: 2; }
        .header-content { display: flex; align-items: center; gap: 20px; }
        .title-logo { width: 70px; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .header-content h1 { margin: 0; font-size: 32px; color: #546e7a; text-shadow: 2px 2px 0px #ecf0f1, 4px 4px 5px rgba(0,0,0,0.15); letter-spacing: 1px; font-weight: 900; }
        
        .user-info { background: #f1c40f; border: none; padding: 8px 18px; border-radius: 30px; font-size: 15px; color: #d35400; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: #c0392b; }

        .category-header { margin: 30px 50px 0; font-size: 22px; color: #546e7a; border-bottom: 3px dashed #bdc3c7; padding-bottom: 10px; font-weight: bold; text-shadow: 1px 1px 0px #ecf0f1; }
        .grid-container { padding: 20px 50px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 35px; }
        
        .app-card { background-color: transparent; border: none; border-radius: 16px; cursor: pointer; transition: all 0.3s ease; overflow: hidden; aspect-ratio: 1 / 1; position: relative; }
        .app-card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .app-card:active { transform: scale(0.95); }
        .app-icon { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 0.3s; }
        
        .restricted { box-shadow: 0 0 0 3px #ff4757, 0 0 15px rgba(255, 71, 87, 0.7); }
        .restricted:hover { box-shadow: 0 0 0 3px #ff4757, 0 0 25px rgba(255, 71, 87, 1); }

        .admin-btn { display: none; position: fixed; bottom: 30px; right: 30px; background: #2ecc71; color: #fff; border: none; padding: 15px 25px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 100; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        .admin-btn:active { transform: translateY(0); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { background: #ffffff; color: #333; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin: 5% auto; padding: 30px; border-radius: 25px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .tabs { display: flex; border-bottom: 2px solid #ecf0f1; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #95a5a6; }
        .tab.active { border-bottom: 3px solid #e74c3c; color: #e74c3c; margin-bottom: -2px; }
        
        .manage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .manage-header h3 { margin: 0; font-size: 16px; color: #546e7a; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #3498db; }
        .form-group input[type="text"], .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid #bdc3c7; border-radius: 12px; background: #f8f9fa; color: #333; font-weight: bold; transition: 0.2s;}
        .form-group input[type="text"]:focus, .form-group select:focus { outline: none; border-color: #3498db; background: #fff; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-left: 5px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.95); }
        .btn-green { background-color: #2ecc71; color: white; }
        .btn-gray { background-color: #95a5a6; color: white; }
        .btn-red { background-color: #e74c3c; color: white; }
        .btn-blue { background-color: #3498db; color: white; }
        .btn-purple { background-color: #9b59b6; color: white; } 
        .btn-small { padding: 6px 10px; font-size: 13px; }
        
        .manage-list { list-style: none; padding: 0; margin: 0;}
        .manage-cat-title { font-size: 16px; color: #e67e22; border-bottom: 2px dashed #f39c12; margin-top: 20px; padding-bottom: 5px; margin-bottom: 10px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 2px solid #ecf0f1; background: #fdfefe; border-radius: 15px; margin-bottom: 10px; }
        .manage-item-info { display: flex; flex-direction: column; gap: 5px; font-size: 15px; font-weight: bold; color: #2c3e50; }
        .click-badge { color: #e74c3c; font-size: 12px; background: #fdebd0; padding: 3px 8px; border-radius: 10px; width: fit-content; }
        .manage-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

        @media (max-width: 768px) {
            .banner-header { padding: 10px 15px; flex-direction: row; align-items: center; border-bottom: 3px solid #e74c3c; }
            .header-content { gap: 8px; }
            .header-content h1 { font-size: 16px; text-shadow: 1px 1px 0px #ecf0f1; } 
            .title-logo { width: 30px; } 
            .user-info { padding: 4px 8px; font-size: 11px; flex-direction: column; gap: 4px; }
            #user-name-display { font-size: 10px; }
            .logout-btn { padding: 3px 8px; font-size: 10px; }
            .category-header { margin: 20px 15px 0; font-size: 18px; }
            .grid-container { grid-template-columns: repeat(2, 1fr); padding: 15px; gap: 15px; }
            .app-card { border-radius: 12px; } 
            .admin-btn { padding: 10px 15px; font-size: 14px; bottom: 20px; right: 20px; }
            .manage-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <img src="https://i.ibb.co/qMGJpFQ3/image.png" alt="校徽">
        <h2>香海正覺蓮社<br>佛教正覺蓮社學校</h2>
        <p style="color: #7f8c8d; font-size: 14px;">一站式教師行政平台</p>
        <button id="google-login-btn" class="google-btn" onclick="loginWithGoogle()">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google"> 
            使用學校帳號登入
        </button>
    </div>
</div>

<div class="main-content" id="main-content">
    <div class="banner-header">
        <div class="header-content">
            <img src="https://i.ibb.co/qMGJpFQ3/image.png" alt="校徽" class="title-logo">
            <h1>一站式教師行政平台</h1>
        </div>
        <div class="user-info">
            <span id="user-name-display">🌟 讀取中...</span>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
    </div>
    
    <div id="app-container"></div>
    <button id="admin-btn" class="admin-btn" onclick="openAdmin()">🍄 進入後台管理</button>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <div class="tabs">
            <div class="tab active" id="tab-manage" onclick="switchTab('manage')">方塊管理與排序</div>
            <div class="tab" id="tab-add" onclick="switchTab('add')">製作新方塊</div>
        </div>

        <div id="section-manage">
            <div class="manage-header">
                <h3>已建立的方塊清單</h3>
                <div>
                    <button class="btn btn-purple btn-small" id="bulkConvertBtn" onclick="bulkConvertImages()">🌟 一鍵修復 Google 圖片</button>
                    <button class="btn btn-red btn-small" onclick="resetClicks()">🔄 重置點擊率</button>
                </div>
            </div>
            <div id="manage-list-container"></div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn btn-gray" onclick="closeAdmin()">關閉</button>
            </div>
        </div>

        <div id="section-add" style="display:none;">
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-group">
                <label>1. 方塊名稱：</label>
                <input type="text" id="appNameInput" placeholder="例如：教育局網頁">
            </div>
            <div class="form-group">
                <label>2. 選擇分類：</label>
                <select id="appCategoryInput">
                    <option value="行政">💼 行政</option>
                    <option value="學與教">📚 學與教</option>
                </select>
            </div>
            <div class="form-group">
                <label>3. 圖片來源 (可直接貼 Google Drive 連結，系統會自動轉檔)：</label>
                <input type="text" id="appImgInput" placeholder="貼上 Google Drive 或 ImgBB 連結">
            </div>
            <div class="form-group">
                <label>4. 傳送連結 (Hyperlink)：</label>
                <input type="text" id="appLinkInput" placeholder="例如：https://www.edb.gov.hk">
            </div>
            <div class="form-group">
                <label style="color: #e74c3c;"><input type="checkbox" id="appRestrictedInput"> ⚠️ 鎖定 (需要密碼驗證)</label>
            </div>
            <div class="form-group" id="password-group" style="display: none;">
                <label style="color: #e74c3c;">設定專屬解鎖密碼：</label>
                <input type="text" id="appPasswordInput" placeholder="請輸入自訂密碼">
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn btn-gray" onclick="switchTab('manage')">取消</button>
                <button class="btn btn-green" id="saveBtn" onclick="saveApp()">確認建造</button>
            </div>
        </div>
    </div>
</div>

<script>
    // =========================================
    // ⭐️ 1. 請填入您的 API Keys
    // =========================================
    const IMGBB_API_KEY = 'aa6868806920fc525cbec2ebce679284';

    const ALLOWED_DOMAIN = '@bcklas.edu.hk';
    const ADMIN_EMAILS = ['lwysams@bcklas.edu.hk', 'slssams@bcklas.edu.hk'];

    const firebaseConfig = {
        apiKey: "AIzaSyAEM_hyUZMXN3QJ4dRSi-fZ2qd8vUhMc2g",
        authDomain: "it-portal-8294b.firebaseapp.com",
        projectId: "it-portal-8294b",
        storageBucket: "it-portal-8294b.firebasestorage.app",
        messagingSenderId: "49238104967",
        appId: "1:49238104967:web:3c32f8cc8496eb86fe9122"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    googleProvider.setCustomParameters({ hd: "bcklas.edu.hk" });

    let appsData = [];
    let clicksData = {}; 
    let dbUnsubscribe = null;
    let clicksUnsubscribe = null; 
    
    const CATEGORIES = ['行政', '學與教'];

    document.getElementById('appRestrictedInput').addEventListener('change', function() {
        document.getElementById('password-group').style.display = this.checked ? 'block' : 'none';
    });

    // ⭐️ 核心改良 1：主動且即時地捕獲「重定向登入結果」
    auth.getRedirectResult().then((result) => {
        if (result && result.user) {
            console.log("✅ 成功捕獲重定向登入帳號:", result.user.email);
            handleUserStatus(result.user);
        }
    }).catch((error) => {
        console.error("重定向登入異常:", error);
    });

    // ⭐️ 核心改良 2：優化 Auth 狀態監聽邏輯
    auth.onAuthStateChanged((user) => {
        handleUserStatus(user);
    });

    // ⭐️ 核心改良 3：整合式使用者狀態處理器 (防呆與秒速畫面解鎖)
    function handleUserStatus(user) {
        if (user) {
            // 安全驗證：限制特定網域信箱
            if (!user.email.endsWith(ALLOWED_DOMAIN)) {
                alert('⛔ 存取被拒絕！\n\n此平台僅限「香海正覺蓮社佛教正覺蓮社學校」教職員使用。');
                auth.signOut(); 
                return;
            }

            // 100% 登入成功：秒速關閉登入框，解鎖主畫面
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            let shortName = user.displayName ? user.displayName.split(' ')[0] : '老師';
            document.getElementById('user-name-display').innerText = `🌟 ${shortName}`;
            
            if (ADMIN_EMAILS.includes(user.email)) {
                document.getElementById('admin-btn').style.display = 'block';
            } else {
                document.getElementById('admin-btn').style.display = 'none';
            }

            // 避免重複監聽
            if (!dbUnsubscribe) {
                loadData();
            }
        } else {
            // 100% 登出成功：秒速切換回登入畫面
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('admin-btn').style.display = 'none'; 
            document.getElementById('google-login-btn').innerText = '使用學校帳號登入';
            document.getElementById('google-login-btn').disabled = false;
            
            if (dbUnsubscribe) { dbUnsubscribe(); dbUnsubscribe = null; }
            if (clicksUnsubscribe) { clicksUnsubscribe(); clicksUnsubscribe = null; }
        }
    }

    // 智慧辨識裝置登入模式
    window.loginWithGoogle = function() { 
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const loginBtn = document.getElementById('google-login-btn');
        
        loginBtn.innerText = '⚙️ 正在登入...';
        loginBtn.disabled = true;

        if (isMobile) {
            // 行動端：重定向跳轉
            auth.signInWithRedirect(googleProvider);
        } else {
            // 電腦端：Popup 彈窗
            auth.signInWithPopup(googleProvider).catch((error) => { 
                alert("登入失敗：" + error.message); 
                loginBtn.innerText = '使用學校帳號登入';
                loginBtn.disabled = false;
            });
        }
    }

    window.logout = function() { 
        auth.signOut().then(() => {
            // 登出後強制清空瀏覽器狀態並刷新頁面，保證重定向乾淨
            window.location.reload(); 
        });
    }

    const defaultApps = [
        { name: '學校行事曆', img: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png', url: 'https://www.google.com/calendar', restricted: false, password: '', category: '行政' }
    ];

    function loadData() {
        dbUnsubscribe = db.collection("school_portal").doc("apps_data").onSnapshot((doc) => {
            if (doc.exists && doc.data().list && doc.data().list.length > 0) appsData = doc.data().list;
            else { appsData = JSON.parse(JSON.stringify(defaultApps)); if (auth.currentUser && ADMIN_EMAILS.includes(auth.currentUser.email)) saveData(); }
            renderApps();
            if (auth.currentUser && ADMIN_EMAILS.includes(auth.currentUser.email)) renderManageList();
        });
        clicksUnsubscribe = db.collection("school_portal").doc("clicks_data").onSnapshot((doc) => {
            if (doc.exists) clicksData = doc.data(); else clicksData = {};
            if (auth.currentUser && ADMIN_EMAILS.includes(auth.currentUser.email)) renderManageList();
        });
    }

    function saveData() { db.collection("school_portal").doc("apps_data").set({ list: appsData }).catch(err => { alert("儲存失敗：您可能沒有權限寫入資料庫！"); }); }
    function recordClick(appName) { db.collection("school_portal").doc("clicks_data").set({ [appName]: firebase.firestore.FieldValue.increment(1) }, { merge: true }).catch(err => console.error("點擊記錄失敗", err)); }
    
    window.resetClicks = function() {
        if(confirm('⚠️ 確定要將所有點擊率數據歸零嗎？此動作無法復原！')) {
            db.collection("school_portal").doc("clicks_data").set({}).then(() => alert("✅ 點擊率已全數重置為 0！")).catch(err => alert("重置失敗：" + err.message));
        }
    }

    function renderApps() {
        const container = document.getElementById('app-container');
        container.innerHTML = ''; 
        CATEGORIES.forEach(cat => {
            const catApps = appsData.filter(app => app.category === cat || (!app.category && cat === '行政'));
            if(catApps.length > 0) {
                const header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = cat === '行政' ? '💼 行政' : '📚 學與教';
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'grid-container';
                catApps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = app.restricted ? 'app-card restricted' : 'app-card';
                    card.title = app.name; 
                    card.onclick = () => {
                        if (app.restricted) {
                            let pwd = prompt('🔥 此為機密區域，請輸入通關密碼：');
                            if (pwd === app.password) { recordClick(app.name); if (app.url !== '#') window.open(app.url, '_blank'); } 
                            else if (pwd !== null) alert('❌ 密碼錯誤！');
                        } else {
                            recordClick(app.name); if (app.url !== '#') window.open(app.url, '_blank');
                        }
                    };
                    card.innerHTML = `<img src="${app.img}" class="app-icon" alt="${app.name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1006/1006490.png'">`;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        });
    }

    function renderManageList() {
        const container = document.getElementById('manage-list-container');
        container.innerHTML = '';
        if (appsData.length === 0) return;
        CATEGORIES.forEach(cat => {
            const catItems = appsData.map((app, index) => ({ app, origIndex: index })).filter(item => item.app.category === cat || (!item.app.category && cat === '行政'));
            if(catItems.length > 0) {
                const header = document.createElement('div');
                header.className = 'manage-cat-title';
                header.innerText = cat === '行政' ? '💼 行政分類' : '📚 學與教分類';
                container.appendChild(header);
                const ul = document.createElement('ul');
                ul.className = 'manage-list';
                catItems.forEach((item) => {
                    const app = item.app; const oIndex = item.origIndex; let clickCount = clicksData[app.name] || 0;
                    const li = document.createElement('li');
                    li.className = 'manage-item';
                    li.innerHTML = `
                        <div class="manage-item-info"><div>${app.name} ${app.restricted ? '🔒' : ''}</div><div class="click-badge">📊 點擊數: ${clickCount}</div></div>
                        <div class="manage-actions">
                            <button class="btn btn-gray btn-small" onclick="moveWithinCategory(${oIndex}, -1, '${cat}')">⬆️</button>
                            <button class="btn btn-gray btn-small" onclick="moveWithinCategory(${oIndex}, 1, '${cat}')">⬇️</button>
                            <button class="btn btn-blue btn-small" onclick="editApp(${oIndex})">修改</button>
                            <button class="btn btn-red btn-small" onclick="deleteApp(${oIndex})">刪除</button>
                        </div>
                    `;
                    ul.appendChild(li);
                });
                container.appendChild(ul);
            }
        });
    }

    window.moveWithinCategory = function(originalIndex, direction, cat) {
        const catItems = appsData.map((d, i) => ({d, origIndex: i})).filter(item => item.d.category === cat || (!item.d.category && cat === '行政'));
        const catIdx = catItems.findIndex(item => item.origIndex === originalIndex);
        if (catIdx + direction >= 0 && catIdx + direction < catItems.length) {
            const swapWithOrigIndex = catItems[catIdx + direction].origIndex;
            const temp = appsData[originalIndex];
            appsData[originalIndex] = appsData[swapWithOrigIndex];
            appsData[swapWithOrigIndex] = temp;
            saveData();
        }
    }
    window.deleteApp = function(index) { if(confirm('確定要把「' + appsData[index].name + '」刪除嗎？')) { appsData.splice(index, 1); saveData(); } }
    
    window.editApp = function(index) {
        const app = appsData[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('appNameInput').value = app.name;
        document.getElementById('appCategoryInput').value = app.category || '行政'; 
        document.getElementById('appImgInput').value = app.img;
        document.getElementById('appLinkInput').value = app.url;
        document.getElementById('appRestrictedInput').checked = app.restricted;
        
        document.getElementById('appPasswordInput').value = app.password || '';
        document.getElementById('password-group').style.display = app.restricted ? 'block' : 'none';
        
        switchTab('add');
    }

    window.bulkConvertImages = async function() {
        if (!confirm('即將掃描所有方塊，並將 Google Drive 圖片自動轉移至 ImgBB (解決死圖)。\n\n確定執行？')) return;
        if (!IMGBB_API_KEY || IMGBB_API_KEY === '請在這裡貼上您的_IMGBB_API_KEY') return alert('⛔ 請先在程式碼開頭設定 IMGBB_API_KEY！');

        const btn = document.getElementById('bulkConvertBtn');
        btn.innerText = '⚙️ 批量轉移中...'; btn.disabled = true;

        let updatedCount = 0; let failedCount = 0; let isModified = false;

        for (let i = 0; i < appsData.length; i++) {
            let app = appsData[i];
            if (app.img && app.img.includes('drive.google.com')) {
                try {
                    let match = app.img.match(/id=([a-zA-Z0-9_-]+)/) || app.img.match(/file\/d\/([a-zA-Z0-9_-]+)/);
                    if (match && match[1]) {
                        const googleThumbnail = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
                        const formData = new FormData(); formData.append('image', googleThumbnail);
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const result = await response.json();

                        if (result.success) { appsData[i].img = result.data.url; updatedCount++; isModified = true; } 
                        else { failedCount++; }
                    }
                } catch (error) { failedCount++; }
            }
        }

        if (isModified) { saveData(); alert(`🎉 轉換完成！\n\n成功轉移: ${updatedCount} 個\n失敗: ${failedCount} 個`); } 
        else if (failedCount > 0) alert("❌ 轉換失敗！請確認 API key 是否設定正確。");
        else alert('✅ 掃描完成！沒有發現需要轉換的 Google Drive 圖片。');

        btn.innerText = '🌟 一鍵修復 Google 圖片'; btn.disabled = false;
    }

    window.saveApp = async function() {
        const index = parseInt(document.getElementById('editIndex').value);
        const name = document.getElementById('appNameInput').value;
        const category = document.getElementById('appCategoryInput').value; 
        let rawImg = document.getElementById('appImgInput').value || 'https://cdn-icons-png.flaticon.com/512/1006/1006490.png'; 
        const link = document.getElementById('appLinkInput').value || '#'; 
        const restricted = document.getElementById('appRestrictedInput').checked;
        const password = document.getElementById('appPasswordInput').value;
        const saveBtn = document.getElementById('saveBtn');

        if (name.trim() === '') return alert('請輸入方塊名稱！');
        if (restricted && password.trim() === '') return alert('請為鎖定的方塊設定密碼！');

        saveBtn.innerText = '⚙️ 處理圖片中...'; saveBtn.disabled = true;
        let finalImg = rawImg;

        if (rawImg.includes('drive.google.com')) {
            const driveRegex = /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
            const match = rawImg.match(driveRegex);
            if (match && match[1]) {
                const googleThumbnail = `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
                if (IMGBB_API_KEY && IMGBB_API_KEY !== '請在這裡貼上您的_IMGBB_API_KEY') {
                    try {
                        const formData = new FormData(); formData.append('image', googleThumbnail);
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const result = await response.json();
                        if (result.success) finalImg = result.data.url; else finalImg = googleThumbnail;
                    } catch (error) { finalImg = googleThumbnail; }
                } else { finalImg = googleThumbnail; }
            }
        }

        const newData = { name, category, img: finalImg, url: link, restricted, password }; 
        if (index === -1) appsData.push(newData); else appsData[index] = newData;
        saveData();
        saveBtn.innerText = '確認建造'; saveBtn.disabled = false; switchTab('manage');
    }

    window.openAdmin = function() { 
        if (auth.currentUser && !ADMIN_EMAILS.includes(auth.currentUser.email)) { alert("您沒有後台管理權限！"); return; }
        document.getElementById('adminModal').style.display = 'block'; switchTab('manage'); 
    }
    window.closeAdmin = function() { document.getElementById('adminModal').style.display = 'none'; }
    window.switchTab = function(tab) {
        document.getElementById('tab-manage').className = tab === 'manage' ? 'tab active' : 'tab';
        document.getElementById('tab-add').className = tab === 'add' ? 'tab active' : 'tab';
        document.getElementById('section-manage').style.display = tab === 'manage' ? 'block' : 'none';
        document.getElementById('section-add').style.display = tab === 'add' ? 'block' : 'none';
        if (tab === 'add' && document.getElementById('editIndex').value === '-1') {
            document.getElementById('appNameInput').value = ''; document.getElementById('appCategoryInput').value = '行政'; 
            document.getElementById('appImgInput').value = ''; document.getElementById('appLinkInput').value = ''; 
            document.getElementById('appRestrictedInput').checked = false; document.getElementById('appPasswordInput').value = ''; 
            document.getElementById('password-group').style.display = 'none'; 
        } else if (tab === 'manage') document.getElementById('editIndex').value = '-1';
    }
</script>
