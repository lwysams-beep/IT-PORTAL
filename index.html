<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香海正覺蓮社佛教正覺蓮社學校 - Firebase 雲端行政平台 V1.15</title>
    
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <style>
        /* 1. 純白背景 */
        body { 
            display: flex; flex-direction: column; height: 100vh; margin: 0; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', 'Segoe UI', Tahoma, sans-serif; 
            background-color: #ffffff;
            color: #333;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f2f6; }
        ::-webkit-scrollbar-thumb { background: #3498db; border-radius: 5px; border: 2px solid #fff; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        
        .banner-header { 
            position: relative; background-image: url('https://drive.google.com/thumbnail?id=1ndm7nhWk0SD9N6A75MmKMjcv5ecZ6_kp&sz=w2000'); 
            background-size: cover; background-position: center; padding: 40px 50px; display: flex; justify-content: space-between; align-items: flex-end; 
            border-bottom: 6px solid #e74c3c; 
        }
        .banner-header::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 1)); z-index: 1; 
        }
        
        .header-content, .user-info { position: relative; z-index: 2; }
        .header-content { display: flex; align-items: center; gap: 20px; }
        .title-logo { width: 70px; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        
        .header-content h1 { 
            margin: 0; font-size: 38px; color: #546e7a; 
            text-shadow: 2px 2px 0px #ecf0f1, 4px 4px 5px rgba(0,0,0,0.15); 
            letter-spacing: 1px; font-weight: 900;
        }
        
        /* 狀態徽章 (加入連線狀態提示) */
        .user-info { 
            background: #f1c40f; border: 3px solid #fff; padding: 8px 18px; border-radius: 30px; 
            font-size: 15px; color: #d35400; font-weight: bold; box-shadow: 0 4px 0px rgba(0,0,0,0.1); 
            display: flex; align-items: center; gap: 8px;
        }
        #connection-status {
            width: 10px; height: 10px; border-radius: 50%; background-color: #95a5a6; display: inline-block;
        }

        /* 2. 應用程式方格 (⭐️ 已移除所有邊框) */
        .grid-container { 
            padding: 50px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 35px; 
        }
        .app-card { 
            background-color: #ffffff; 
            border: none; /* 移除邊框 */
            border-radius: 25px; 
            cursor: pointer; transition: all 0.2s ease; overflow: hidden; aspect-ratio: 1 / 1; position: relative;
            box-shadow: 0 8px 0px #d4ac0d, 0 15px 15px rgba(0,0,0,0.1); 
        }
        .app-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 0px #d4ac0d, 0 20px 20px rgba(0,0,0,0.15); 
        }
        .app-card:active {
            transform: translateY(4px); box-shadow: 0 2px 0px #d4ac0d, 0 5px 5px rgba(0,0,0,0.1);
        }
        
        .app-icon { 
            width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s;
        }
        .app-card:hover .app-icon { transform: scale(1.03); }
        
        /* 庫巴魔王關卡 (保留紅色陰影以作區別，但沒有邊框) */
        .restricted { box-shadow: 0 8px 0px #c0392b, 0 15px 15px rgba(0,0,0,0.1); }
        .restricted:hover { box-shadow: 0 12px 0px #96281b, 0 20px 20px rgba(0,0,0,0.15); }
        .restricted:active { box-shadow: 0 2px 0px #96281b, 0 5px 5px rgba(0,0,0,0.1); }

        .admin-btn { 
            position: fixed; bottom: 30px; right: 30px; background: #2ecc71; color: #fff; 
            border: 4px solid #fff; padding: 15px 25px; border-radius: 30px; font-size: 16px; font-weight: bold; 
            cursor: pointer; z-index: 100; transition: all 0.2s; box-shadow: 0 6px 0px #27ae60, 0 10px 10px rgba(0,0,0,0.2);
        }
        .admin-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0px #27ae60, 0 15px 15px rgba(0,0,0,0.2); }
        .admin-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #27ae60; }

        /* 3. 後台管理介面 */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(3px); }
        .modal-content { 
            background: #ffffff; color: #333; border: 6px solid #3498db; box-shadow: 0 15px 0px #2980b9, 0 20px 30px rgba(0,0,0,0.3); 
            margin: 5% auto; padding: 30px; border-radius: 25px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
        }
        
        .tabs { display: flex; border-bottom: 3px solid #ecf0f1; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #95a5a6; }
        .tab.active { border-bottom: 4px solid #e74c3c; color: #e74c3c; margin-bottom: -3px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #3498db; }
        .form-group input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 3px solid #bdc3c7; border-radius: 12px; background: #f8f9fa; color: #333; font-weight: bold; transition: 0.2s;}
        .form-group input[type="text"]:focus { outline: none; border-color: #f1c40f; background: #fff; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-left: 5px; transition: 0.2s; position: relative; }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(2px); box-shadow: none !important; }
        
        .btn-green { background-color: #2ecc71; color: white; box-shadow: 0 4px 0px #27ae60; }
        .btn-gray { background-color: #95a5a6; color: white; box-shadow: 0 4px 0px #7f8c8d; }
        .btn-red { background-color: #e74c3c; color: white; box-shadow: 0 4px 0px #c0392b; }
        .btn-blue { background-color: #3498db; color: white; box-shadow: 0 4px 0px #2980b9; }
        .btn-small { padding: 6px 10px; font-size: 13px; box-shadow: 0 3px 0px; }
        .btn-small:active { box-shadow: none !important; transform: translateY(3px); }

        .manage-list { list-style: none; padding: 0; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 3px solid #ecf0f1; background: #fdfefe; border-radius: 15px; margin-bottom: 10px; }
        .manage-item-info { font-size: 15px; font-weight: bold; color: #2c3e50; }
        .manage-actions { display: flex; gap: 8px; }

        @media (max-width: 768px) {
            .banner-header { padding: 25px; flex-direction: column; align-items: flex-start; gap: 15px; border-bottom: 4px solid #e74c3c; }
            .header-content { flex-direction: row; gap: 10px; }
            .header-content h1 { font-size: 26px; }
            .title-logo { width: 50px; }
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); padding: 20px; gap: 20px;}
        }
    </style>
</head>
<body>

<div class="main-content">
    <div class="banner-header">
        <div class="header-content">
            <img src="https://drive.google.com/thumbnail?id=1wfosMc8tBrPZTmOavb6shk1R7Gnv9FUn&sz=w500" alt="校徽" class="title-logo">
            <h1>一站式教師行政平台</h1>
        </div>
        <div class="user-info">
            <span id="connection-status"></span>
            <span id="connection-text">本機測試模式</span>
        </div>
    </div>
    
    <div class="grid-container" id="app-grid"></div>
    
    <button class="admin-btn" onclick="openAdmin()">🍄 進入水管 (後台)</button>
</div>

<!-- 後台 Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <div class="tabs">
            <div class="tab active" id="tab-manage" onclick="switchTab('manage')">方塊管理與排序</div>
            <div class="tab" id="tab-add" onclick="switchTab('add')">製作新方塊</div>
        </div>

        <div id="section-manage">
            <ul class="manage-list" id="manage-list-container"></ul>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn btn-gray" onclick="closeAdmin()">關閉</button>
            </div>
        </div>

        <div id="section-add" style="display:none;">
            <input type="hidden" id="editIndex" value="-1">
            <div class="form-group">
                <label>1. 方塊 (程式) 名稱：</label>
                <input type="text" id="appNameInput" placeholder="例如：教育局網頁">
            </div>
            <div class="form-group">
                <label>2. 圖片來源 (支援 Google Drive 連結)：</label>
                <input type="text" id="appImgInput" placeholder="貼上您的瑪利歐特式圖片連結">
            </div>
            <div class="form-group">
                <label>3. 傳送水管 (Hyperlink) 連結：</label>
                <input type="text" id="appLinkInput" placeholder="例如：https://www.edb.gov.hk">
            </div>
            <div class="form-group">
                <label style="color: #e74c3c;"><input type="checkbox" id="appRestrictedInput"> ⚠️ 庫巴城堡鎖定 (需要密碼驗證)</label>
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn btn-gray" onclick="switchTab('manage')">取消</button>
                <button class="btn btn-green" id="saveBtn" onclick="saveApp()">確認建造</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⭐️ 1. Firebase 雲端資料庫設定區
    // ==========================================
    // (在您建立 Firebase 後，請把獲取的參數取代下方的文字)
    const firebaseConfig = {
        apiKey: "請在此貼上您的_API_KEY",
        authDomain: "請在此貼上您的.firebaseapp.com",
        projectId: "請在此貼上您的_PROJECT_ID",
        storageBucket: "請在此貼上您的.appspot.com",
        messagingSenderId: "請在此貼上您的_ID",
        appId: "請在此貼上您的_APP_ID"
    };

    let appsData = [];
    let db = null;
    let useFirebase = false;

    // 嘗試初始化 Firebase
    try {
        if (firebaseConfig.apiKey !== "請在此貼上您的_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            useFirebase = true;
            document.getElementById('connection-status').style.backgroundColor = '#2ecc71'; // 綠燈
            document.getElementById('connection-text').innerText = 'Firebase 雲端同步中';
        }
    } catch (e) {
        console.error("Firebase 初始化失敗，將使用本機模式", e);
    }

    const defaultApps = [
        { name: '學校行事曆', img: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png', url: 'https://www.google.com/calendar', restricted: false },
        { name: '學生資料庫', img: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png', url: '#', restricted: false },
        { name: '活動通告生成', img: 'https://cdn-icons-png.flaticon.com/512/1075/1075076.png', url: '#', restricted: false },
        { name: '副校長編堂工具', img: 'https://cdn-icons-png.flaticon.com/512/3064/3064197.png', url: '#', restricted: true }
    ];

    // ==========================================
    // ⭐️ 2. 資料存取邏輯 (混合模式)
    // ==========================================
    function loadData() {
        if (useFirebase) {
            // [雲端模式] 實時監聽 Firestore
            db.collection("school_portal").doc("apps_data").onSnapshot((doc) => {
                if (doc.exists) {
                    appsData = doc.data().list || defaultApps;
                } else {
                    appsData = defaultApps;
                    saveData(); // 自動建立初始資料
                }
                renderApps();
                renderManageList();
            });
        } else {
            // [本機模式] 讀取 localStorage
            const stored = localStorage.getItem('bcklas_apps_v15');
            appsData = stored ? JSON.parse(stored) : defaultApps;
            renderApps();
            renderManageList();
        }
    }

    function saveData() {
        if (useFirebase) {
            // [雲端模式] 寫入 Firestore
            db.collection("school_portal").doc("apps_data").set({ list: appsData });
        } else {
            // [本機模式] 寫入 localStorage
            localStorage.setItem('bcklas_apps_v15', JSON.stringify(appsData));
            renderApps();
            renderManageList();
        }
    }

    function convertDriveLink(url) {
        const driveRegex = /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/;
        const match = url.match(driveRegex);
        return (match && match[1]) ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000` : url; 
    }

    // ==========================================
    // ⭐️ 3. 渲染與畫面控制邏輯
    // ==========================================
    function renderApps() {
        const grid = document.getElementById('app-grid');
        grid.innerHTML = ''; 
        appsData.forEach((app, index) => {
            const card = document.createElement('div');
            card.className = app.restricted ? 'app-card restricted' : 'app-card';
            card.title = app.name; 
            
            card.onclick = () => {
                if (app.restricted) {
                    let password = prompt('🔥 警告！此為庫巴魔王關卡，請輸入通關密碼：');
                    if (password === 'admin123') { 
                        if (app.url !== '#') window.open(app.url, '_blank');
                        else alert('🍄 取得無敵星！但尚未設定水管跳躍連結。');
                    } else if (password !== null) alert('❌ 密碼錯誤，被庫巴打敗了！');
                } else {
                    if (app.url !== '#') window.open(app.url, '_blank');
                    else alert('您敲擊了：' + app.name);
                }
            };
            
            card.innerHTML = `<img src="${app.img}" class="app-icon" alt="${app.name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1006/1006490.png'">`;
            grid.appendChild(card);
        });
    }

    function renderManageList() {
        const list = document.getElementById('manage-list-container');
        list.innerHTML = '';
        if (appsData.length === 0) {
            list.innerHTML = '<li style="text-align:center; padding: 20px; color:#95a5a6;">目前沒有任何方塊，請前往「製作新方塊」！</li>';
            return;
        }
        appsData.forEach((app, index) => {
            const li = document.createElement('li');
            li.className = 'manage-item';
            li.innerHTML = `
                <div class="manage-item-info">${app.name} ${app.restricted ? '🔒' : ''}</div>
                <div class="manage-actions">
                    <button class="btn btn-gray btn-small" onclick="moveApp(${index}, -1)">⬆️</button>
                    <button class="btn btn-gray btn-small" onclick="moveApp(${index}, 1)">⬇️</button>
                    <button class="btn btn-blue btn-small" onclick="editApp(${index})">🛠️ 修改</button>
                    <button class="btn btn-red btn-small" onclick="deleteApp(${index})">🗑️ 刪除</button>
                </div>
            `;
            list.appendChild(li);
        });
    }

    window.moveApp = function(index, direction) {
        if (index + direction < 0 || index + direction >= appsData.length) return;
        const temp = appsData[index];
        appsData[index] = appsData[index + direction];
        appsData[index + direction] = temp;
        saveData();
    }

    window.deleteApp = function(index) {
        if(confirm('確定要把「' + appsData[index].name + '」方塊敲碎 (刪除) 嗎？')) {
            appsData.splice(index, 1);
            saveData();
        }
    }

    window.editApp = function(index) {
        const app = appsData[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('appNameInput').value = app.name;
        document.getElementById('appImgInput').value = app.img;
        document.getElementById('appLinkInput').value = app.url;
        document.getElementById('appRestrictedInput').checked = app.restricted;
        switchTab('add');
    }

    window.saveApp = function() {
        const index = parseInt(document.getElementById('editIndex').value);
        const name = document.getElementById('appNameInput').value;
        let img = document.getElementById('appImgInput').value || 'https://cdn-icons-png.flaticon.com/512/1006/1006490.png'; 
        const link = document.getElementById('appLinkInput').value || '#'; 
        const restricted = document.getElementById('appRestrictedInput').checked;

        if (name.trim() === '') return alert('請輸入方塊名稱！');

        img = convertDriveLink(img);

        const newData = { name, img, url: link, restricted };
        if (index === -1) appsData.push(newData);
        else appsData[index] = newData;
        
        saveData();
        switchTab('manage');
    }

    window.openAdmin = function() { 
        const modal = document.getElementById('adminModal');
        if (modal) { switchTab('manage'); modal.style.display = 'block'; }
    }
    
    window.closeAdmin = function() { 
        document.getElementById('adminModal').style.display = 'none'; 
    }
    
    window.switchTab = function(tab) {
        document.getElementById('tab-manage').className = tab === 'manage' ? 'tab active' : 'tab';
        document.getElementById('tab-add').className = tab === 'add' ? 'tab active' : 'tab';
        document.getElementById('section-manage').style.display = tab === 'manage' ? 'block' : 'none';
        document.getElementById('section-add').style.display = tab === 'add' ? 'block' : 'none';
        
        if (tab === 'add' && document.getElementById('editIndex').value === '-1') {
            document.getElementById('appNameInput').value = '';
            document.getElementById('appImgInput').value = '';
            document.getElementById('appLinkInput').value = '';
            document.getElementById('appRestrictedInput').checked = false;
        } else if (tab === 'manage') {
            document.getElementById('editIndex').value = '-1';
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
